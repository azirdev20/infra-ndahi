##Nombre completo del workflow
name: GCP Authentication Test
#Trgigger que va a lanzar el workflow
on: 
  # push:
  #   branches: [ main, master ] #Cuando haya un push en esta ramas se ejecuta
  workflow_dispatch:    # permite ejecutar el workflow manualmente     
### Allow the job to fetch a GitHub ID token by adding the following configuration:
permissions:
  contents: read
  id-token: write
#Jobs que se van a ejecutar
jobs:
#Nombre del job
  prepare:
  # Maquina que se va a usar o distro
    runs-on: ubuntu-latest
      # Variables que se van a usar
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }} #exporta la variable de steps, con el id set-env y toma la variable env_name 
    steps:  #Nombre del step
    
      - id: set-env
        run: |      
          case "${{ github.ref_name }}" in    
          main)    echo "env_name=prod" >> $GITHUB_OUTPUT ;;
          uat)    echo "env_name=uat" >> $GITHUB_OUTPUT ;;
          qa)    echo "env_name=qa" >> $GITHUB_OUTPUT ;;
          *)    echo "env_name=dev" >> $GITHUB_OUTPUT ;;
          esac 
  test-gcp-connection:      #Nombre del segundo job     
    needs: prepare      #depende que se ejecute el job anterior llamado prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.env_name}} # Usa las variables del environment que viene de la rama que se identifica en el job anterior 
    concurrency: ${{ needs.prepare.outputs.env_name}} # Solo se ejecuta un job por rama
    steps:
      - name: Checkout Code # Descarga el codigo de la rama que se va a ejecutar
        uses: actions/checkout@v4

      # 1. Autenticación moderna: Genera las credenciales en el backend automáticamente
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2 
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_WIF }}

      # 2. Configuración oficial del SDK de gcloud para heredar la sesión de arriba
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2     

      # 3. Verificación limpia sin necesidad de "gcloud auth login" manual
      - name: Verify Connection
        run: |         #Imprime las redes que tiene acceso y la cuenta que tiene acceso
          gcloud auth list
          gcloud compute networks list 

