name: GCP Authentication Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
### Allow the job to fetch a GitHub ID token by adding the following configuration:
permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - id: set-env
        run: |
          case "${{ github.ref_name}}" in
          main)    echo "env_name=prod" >> $GITHUB_OUTPUT ;;
          uat)    echo "env_name=uat" >> $GITHUB_OUTPUT ;;
          qa)    echo "env_name=qa" >> $GITHUB_OUTPUT ;;
          dev)    echo "env_name=dev" >> $GITHUB_OUTPUT ;;
          esac
  test-gcp-connection:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.env_name}}
    concurrency: ${{ needs.prepare.outputs.env_name}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación moderna: Genera las credenciales en el backend automáticamente
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_WIF }}

      # 2. Configuración oficial del SDK de gcloud para heredar la sesión de arriba
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Verificación limpia sin necesidad de "gcloud auth login" manual
      - name: Verify Connection
        run: |
          gcloud auth list
          gcloud compute networks list 

