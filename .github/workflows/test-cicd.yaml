name: GCP Authentication Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
### Allow the job to fetch a GitHub ID token by adding the following configuration:
permissions:
  contents: read
  id-token: write

jobs:
  test-gcp-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación moderna: Genera las credenciales en el backend automáticamente
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: 'networking-services-ndahi '
          workload_identity_provider: 'projects/879534488129/locations/global/workloadIdentityPools/wif-pool-ndahi-dev/providers/wif-provider-github'
          service_account: 'sa-wif-github@networking-services-ndahi.iam.gserviceaccount.com'

      # 2. Configuración oficial del SDK de gcloud para heredar la sesión de arriba
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Verificación limpia sin necesidad de "gcloud auth login" manual
      - name: Verify Connection
        run: |
          gcloud auth list

